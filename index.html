<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 6</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
   <div class="weather-card">
        <h1 class="title">Live Weather Tracker</h1>
        
        <!-- Search Controls -->
        <div class="search-container">
            <input type="text" id="cityInput" placeholder="Enter city name..." aria-label="City Name">
            <button id="searchButton">Fetch Live Data</button>
        </div>

        <!-- Status Messaging -->
        <div id="statusMessage" class="status-message" role="alert"></div>

        <!-- Dynamic Data Display Container -->
        <div id="weatherDisplay" class="weather-display">
            <h2 id="locationName" class="location">---</h2>
            <div class="metrics">
                <div id="temperatureDisplay" class="temperature">--°C</div>
                <div id="conditionDisplay" class="condition">---</div>
            </div>
            <div class="details">
                <p><div id="windDisplay">--</div> </p>
                <p><div id="humidityDisplay">--</div></p>
            </div>

        </div>
    </div>
    <script src="script.js"></script>
 </body>
